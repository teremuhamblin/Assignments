name: bmeg400e-env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --------------------------------------------------------------------------
  # Environnement R et bibliothèques d'analyse / visualisation
  # --------------------------------------------------------------------------
  - r-base >=4.2.0
  - r-tidyverse
  - r-ggplot2
  - bioconductor-genomicranges
  - bioconductor-rsamtools

  # --------------------------------------------------------------------------
  # Outils de contrôle qualité (QC)
  # --------------------------------------------------------------------------
  - fastqc >=0.11.9
  - multiqc >=1.14

  # --------------------------------------------------------------------------
  # Prétraitement et rognage (Trimming)
  # --------------------------------------------------------------------------
  - trimmomatic
  - fastp

  # --------------------------------------------------------------------------
  # Alignement sur génome de référence
  # --------------------------------------------------------------------------
  - bwa
  - bowtie2

  # --------------------------------------------------------------------------
  # Manipulation des fichiers SAM/BAM et intervalles génomiques
  # --------------------------------------------------------------------------
  - samtools >=1.16
  - bedtools
